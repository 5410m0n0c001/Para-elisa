<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Un momento especial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Great+Vibes&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1c1712;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .cover {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 1;
    transition: opacity 1.1s ease;
  }

  .stage.playing .cover {
    opacity: 0;
    pointer-events: none;
  }

  .cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10, 8, 6, 0.55) 0%, rgba(10, 8, 6, 0.05) 35%, rgba(10, 8, 6, 0.35) 100%);
  }

  .overlay-text {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    text-align: center;
    color: #fdf6ec;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .overlay-text .ornament {
    font-size: 22px;
    letter-spacing: 8px;
    color: #e6c58f;
    margin-bottom: 6px;
  }

  .overlay-text h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: 44px;
    margin: 0;
  }

  .overlay-text .subtitle {
    font-size: 17px;
    font-style: italic;
    opacity: 0.9;
    margin-top: 4px;
  }

  .cta {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 34px;
    background: rgba(28, 23, 18, 0.35);
    border: 1px solid #e6c58f;
    color: #fdf6ec;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    cursor: pointer;
    backdrop-filter: blur(2px);
    transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .cta:hover {
    background: rgba(230, 197, 143, 0.18);
    transform: translateX(-50%) scale(1.04);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  .cta .ring {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid #e6c58f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cta .ring::after {
    content: "";
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid #e6c58f;
    margin-left: 2px;
  }

  .stage.playing .cta {
    opacity: 0;
    pointer-events: none;
  }

  .video-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
    opacity: 0;
    transition: opacity 1.1s ease;
  }

  .stage.playing .video-wrap {
    opacity: 1;
  }

  .video-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="cover" id="cover">
      <img src="ChatGPT Image 13 ago 2026, 02_23_39 p.m..png" alt="Portada">
    </div>

    <div class="overlay-text">
      <div class="ornament">✦ ✦ ✦</div>
      <h1>Rosario e Hija</h1>
      <div class="subtitle">un pequeño recuerdo, guardado con cariño</div>
    </div>

    <button class="cta" id="ctaButton" type="button">
      <span class="ring"></span>
      <span>Haz clic aquí</span>
    </button>

    <div class="video-wrap" id="videoWrap"></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const videoWrap = document.getElementById('videoWrap');
  const ctaButton = document.getElementById('ctaButton');
  const YOUTUBE_ID = '8izCDi7d2V8';

  ctaButton.addEventListener('click', () => {
    if (stage.classList.contains('playing')) return;
    stage.classList.add('playing');

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${YOUTUBE_ID}?autoplay=1&rel=0&playsinline=1`;
    iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    iframe.setAttribute('allowfullscreen', '');
    iframe.title = 'Video';
    videoWrap.appendChild(iframe);

    const fsTarget = document.documentElement;
    if (fsTarget.requestFullscreen) {
      fsTarget.requestFullscreen().catch(() => {});
    } else if (fsTarget.webkitRequestFullscreen) {
      fsTarget.webkitRequestFullscreen();
    }
  });
</script>

</body>
</html>
