<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Un momento especial</title>
<meta name="description" content="Un pequeño recuerdo, guardado con cariño.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://5410m0n0c001.github.io/Para-elisa/">
<meta property="og:title" content="Un momento especial">
<meta property="og:description" content="Un pequeño recuerdo, guardado con cariño.">
<meta property="og:image" content="https://5410m0n0c001.github.io/Para-elisa/fondo.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1536">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Un momento especial">
<meta name="twitter:description" content="Un pequeño recuerdo, guardado con cariño.">
<meta name="twitter:image" content="https://5410m0n0c001.github.io/Para-elisa/fondo.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Great+Vibes&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #1c1712;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .cover {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 1;
    transition: opacity 1.1s ease;
  }

  .stage.playing .cover {
    opacity: 0;
    pointer-events: none;
  }

  .cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10, 8, 6, 0.55) 0%, rgba(10, 8, 6, 0.05) 35%, rgba(10, 8, 6, 0.35) 100%);
  }

  .cta {
    position: absolute;
    bottom: max(8%, calc(env(safe-area-inset-bottom, 0px) + 24px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 12px clamp(20px, 6vw, 26px);
    background: rgba(28, 23, 18, 0.35);
    border: 1px solid #e6c58f;
    color: #fdf6ec;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 4vw, 17px);
    letter-spacing: 1.2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(2px);
    transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .cta:hover {
    background: rgba(230, 197, 143, 0.18);
    transform: translateX(-50%) scale(1.04);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  .cta .ring {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #e6c58f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cta .ring::after {
    content: "";
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 7px solid #e6c58f;
    margin-left: 1px;
  }

  .stage.playing .cta {
    opacity: 0;
    pointer-events: none;
  }

  .video-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
    opacity: 0;
    transition: opacity 1.1s ease;
  }

  .stage.playing .video-wrap {
    opacity: 1;
  }

  .video-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="cover" id="cover">
      <img src="fondo.png" alt="Portada">
    </div>

    <button class="cta" id="ctaButton" type="button">
      <span class="ring"></span>
      <span>Clic aquí</span>
    </button>

    <div class="video-wrap" id="videoWrap"></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const videoWrap = document.getElementById('videoWrap');
  const ctaButton = document.getElementById('ctaButton');
  const YOUTUBE_ID = 'idUWgfcLzdQ';

  function requestFS(el) {
    try {
      if (el.requestFullscreen) {
        const p = el.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.webkitRequestFullScreen) {
        el.webkitRequestFullScreen();
      } else if (el.mozRequestFullScreen) {
        el.mozRequestFullScreen();
      } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
      }
    } catch (e) {}
  }

  ctaButton.addEventListener('click', () => {
    if (stage.classList.contains('playing')) return;
    stage.classList.add('playing');

    // pedir pantalla completa como primera accion dentro del gesto del usuario
    requestFS(stage);

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${YOUTUBE_ID}?autoplay=1&rel=0&playsinline=1`;
    iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
    iframe.setAttribute('allowfullscreen', '');
    iframe.title = 'Video';
    videoWrap.appendChild(iframe);
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) stage.classList.remove('fullscreened');
    else stage.classList.add('fullscreened');
  });
</script>

</body>
</html>
